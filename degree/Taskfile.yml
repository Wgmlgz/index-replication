version: '3'
output: prefixed

vars:
  IMAGE: degree-latex-gost
  MAIN_TEX: src/main.tex
  OUT_DIR: build
  TEXINPUTS: "./template/gost-7-32/tex/latex:"
  BSTINPUTS: "./template/gost-7-32/bibtex/bst:"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  docker:build:
    desc: Build Docker image with TeX Live
    cmds:
      - docker build -t {{.IMAGE}} .

  build:
    desc: Generate PDF once
    deps:
      - docker:build
    cmds:
      - >-
        docker run --rm
        -v "$PWD:/work"
        -w /work
        -e TEXINPUTS={{.TEXINPUTS}}
        -e BSTINPUTS={{.BSTINPUTS}}
        {{.IMAGE}}
        latexmk -pdf -interaction=nonstopmode -file-line-error -synctex=1
        -output-directory={{.OUT_DIR}} {{.MAIN_TEX}}

  watch:
    desc: Watch source files and continuously rebuild PDF
    deps:
      - docker:build
    cmds:
      - >-
        docker run --rm
        -v "$PWD:/work"
        -w /work
        -e TEXINPUTS={{.TEXINPUTS}}
        -e BSTINPUTS={{.BSTINPUTS}}
        {{.IMAGE}}
        latexmk -pdf -interaction=nonstopmode -file-line-error -synctex=1
        -output-directory={{.OUT_DIR}} -pvc -view=none {{.MAIN_TEX}}

  watch:native:
    desc: Watch source files and continuously rebuild PDF using user-local TinyTeX
    cmds:
      - >-
        TEXBIN="$(echo "$HOME"/Library/TinyTeX/bin/*)" &&
        TEXINPUTS={{.TEXINPUTS}} BSTINPUTS={{.BSTINPUTS}}
        "$TEXBIN/latexmk" -pdf -interaction=nonstopmode -file-line-error -synctex=1
        -output-directory={{.OUT_DIR}} -pvc -view=none {{.MAIN_TEX}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.OUT_DIR}}/*.aux {{.OUT_DIR}}/*.bbl {{.OUT_DIR}}/*.blg {{.OUT_DIR}}/*.fdb_latexmk {{.OUT_DIR}}/*.fls {{.OUT_DIR}}/*.log {{.OUT_DIR}}/*.out {{.OUT_DIR}}/*.synctex.gz {{.OUT_DIR}}/*.toc {{.OUT_DIR}}/*.pdf
