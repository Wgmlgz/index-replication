x-temporal-admin-tools-build: &temporal_admin_tools_build
  build:
    context: .
    dockerfile: scripts/temporal/admin-tools.Dockerfile
    args:
      TEMPORAL_VERSION: ${TEMPORAL_VERSION:-1.30.1}

x-temporal-server-build: &temporal_server_build
  build:
    context: .
    dockerfile: scripts/temporal/server.Dockerfile
    args:
      TEMPORAL_VERSION: ${TEMPORAL_VERSION:-1.30.1}

x-keycloak-terraform-env: &keycloak_terraform_env
  TF_CLI_CONFIG_FILE: /opt/terraform/terraformrc
  TF_VAR_postgres_db: ${POSTGRES_DB}
  TF_VAR_postgres_user: ${POSTGRES_USER}
  TF_VAR_postgres_password: ${POSTGRES_PASSWORD}
  TF_VAR_keycloak_url: ${KEYCLOAK_API_BASE_URL:-http://keycloak:8080/auth}
  TF_VAR_keycloak_login_theme: ${KEYCLOAK_THEME_NAME:-index-replication}
  TF_VAR_keycloak_db_schema: ${KEYCLOAK_DB_SCHEMA:-keycloak}
  TF_VAR_keycloak_admin_user: ${KEYCLOAK_ADMIN_USER:-admin}
  TF_VAR_keycloak_admin_password: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
  TF_VAR_keycloak_realm: ${KEYCLOAK_REALM:-index-replication}
  TF_VAR_keycloak_realm_display_name: "${KEYCLOAK_REALM_DISPLAY_NAME:-Index Replication}"
  TF_VAR_keycloak_admin_realm: ${KEYCLOAK_ADMIN_REALM:-index-replication-admin}
  TF_VAR_keycloak_admin_realm_display_name: "${KEYCLOAK_ADMIN_REALM_DISPLAY_NAME:-Index Replication Admin}"
  TF_VAR_keycloak_admin_proxy_client_id: ${KEYCLOAK_ADMIN_PROXY_CLIENT_ID:-admin-proxy}
  TF_VAR_keycloak_admin_proxy_client_secret: ${KEYCLOAK_ADMIN_PROXY_CLIENT_SECRET:-change-me}
  TF_VAR_keycloak_admin_proxy_redirect_uris: ${KEYCLOAK_ADMIN_PROXY_REDIRECT_URIS:-["http://localhost:30000/oauth2/callback","http://app123.localhost:30000/oauth2/callback"]}
  TF_VAR_keycloak_bootstrap_user: "${KEYCLOAK_BOOTSTRAP_USER:-}"
  TF_VAR_keycloak_bootstrap_user_password: "${KEYCLOAK_BOOTSTRAP_USER_PASSWORD:-}"
  TF_VAR_keycloak_bootstrap_user_email: "${KEYCLOAK_BOOTSTRAP_USER_EMAIL:-}"

x-keycloak-terraform-build: &keycloak_terraform_build
  build:
    context: ./infra/terraform/keycloak
    dockerfile: Dockerfile
    args:
      TERRAFORM_VERSION: ${TERRAFORM_VERSION:-1.7.5}
      POSTGRESQL_PROVIDER_VERSION: ${POSTGRESQL_PROVIDER_VERSION:-1.26.0}
      KEYCLOAK_PROVIDER_VERSION: ${KEYCLOAK_PROVIDER_VERSION:-5.3.0}

services:
  temporal-admin-tools:
    <<: *temporal_admin_tools_build
    restart: on-failure:6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
      - SQL_PASSWORD=${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh

  temporal:
    <<: *temporal_server_build
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/docker.yaml
    ports:
      - "127.0.0.1:${TEMPORAL_GRPC_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.47.2}
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_UI_PORT=8082
      - TEMPORAL_UI_PUBLIC_PATH=/temporal
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8082"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.temporal-ui-local.rule=Host(`localhost`) && PathPrefix(`/temporal`)"
      - "traefik.http.routers.temporal-ui-local.entrypoints=web"
      - "traefik.http.routers.temporal-ui-local.priority=131"
      - "traefik.http.routers.temporal-ui.rule=PathPrefix(`/temporal`)"
      - "traefik.http.routers.temporal-ui.entrypoints=web"
      - "traefik.http.routers.temporal-ui.priority=120"
      - "traefik.http.routers.temporal-ui.middlewares=admin-auth-errors@docker,admin-auth@docker"
      - "traefik.http.services.temporal-ui.loadbalancer.server.port=8082"

  traefik:
    image: traefik:v2.11
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:${TRAEFIK_PORT}"
    ports:
      - "${TRAEFIK_PORT}:${TRAEFIK_PORT}"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: on-failure
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.admin-auth.forwardauth.address=http://oauth2-proxy:4180/oauth2/auth"
      - "traefik.http.middlewares.admin-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.admin-auth.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email,Authorization"
      - "traefik.http.middlewares.admin-auth-errors.errors.status=401-403"
      - "traefik.http.middlewares.admin-auth-errors.errors.service=oauth2-proxy@docker"
      - "traefik.http.middlewares.admin-auth-errors.errors.query=/oauth2/sign_in?rd={url}"

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak-terraform-db:
    <<: *keycloak_terraform_build
    working_dir: /workspace/infra/terraform/keycloak
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    environment:
      <<: *keycloak_terraform_env
    entrypoint:
      - /bin/sh
      - -ec
      - |
          terraform init -input=false
          terraform apply -input=false -auto-approve -state=/workspace/terraform-state/terraform.tfstate -target=postgresql_schema.keycloak
    volumes:
      - keycloak_terraform_state:/workspace/terraform-state

  keycloak:
    build:
      context: .
      dockerfile: scripts/keycloak/Dockerfile
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION:-26.1}
        KEYCLOAK_THEME_NAME: ${KEYCLOAK_THEME_NAME:-index-replication}
    image: index-replication-keycloak:${KEYCLOAK_VERSION:-26.1}
    command: ["start-dev"]
    depends_on:
      keycloak-terraform-db:
        condition: service_completed_successfully
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      - KC_DB_SCHEMA=${KEYCLOAK_DB_SCHEMA:-keycloak}
      - KC_HTTP_ENABLED=true
      - KC_HTTP_PORT=8080
      - KC_HTTP_RELATIVE_PATH=${KEYCLOAK_HTTP_RELATIVE_PATH:-/auth}
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_PROXY_HEADERS=xforwarded
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-18081}:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=PathPrefix(`${KEYCLOAK_HTTP_RELATIVE_PATH:-/auth}`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.routers.keycloak.priority=90"

  keycloak-terraform:
    <<: *keycloak_terraform_build
    working_dir: /workspace/infra/terraform/keycloak
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
          terraform init -input=false
          terraform apply -input=false -auto-approve -state=/workspace/terraform-state/terraform.tfstate
    restart: on-failure
    environment:
      <<: *keycloak_terraform_env
    volumes:
      - keycloak_terraform_state:/workspace/terraform-state

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    depends_on:
      keycloak:
        condition: service_healthy
    restart: on-failure
    environment:
      - OAUTH2_PROXY_PROVIDER=keycloak-oidc
      - OAUTH2_PROXY_OIDC_ISSUER_URL=${KEYCLOAK_API_BASE_URL:-http://keycloak:8080/auth}/realms/${KEYCLOAK_ADMIN_REALM:-index-replication-admin}
      - OAUTH2_PROXY_CLIENT_ID=${KEYCLOAK_ADMIN_PROXY_CLIENT_ID:-admin-proxy}
      - OAUTH2_PROXY_CLIENT_SECRET=${KEYCLOAK_ADMIN_PROXY_CLIENT_SECRET:-change-me}
      - OAUTH2_PROXY_COOKIE_SECRET=${ADMIN_AUTH_COOKIE_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_UPSTREAMS=file:///dev/null
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_COOKIE_SECURE=false
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oauth2.rule=PathPrefix(`/oauth2`)"
      - "traefik.http.routers.oauth2.entrypoints=web"
      - "traefik.http.routers.oauth2.priority=140"
      - "traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180"

  api:
    build:
      context: ./api
    volumes:
      - ./api/certs:/root/certs:ro
    environment:
      - PORT=30000
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_TTL=15m
      - REFRESH_TOKEN_TTL=168h
      - COOKIE_SECURE=false
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - CORS_ORIGINS=http://${WEB_HOST}
      - RUN_MIGRATIONS=true
      - KEYCLOAK_BASE_URL=${KEYCLOAK_API_BASE_URL:-http://keycloak:8080/auth}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-index-replication}
      - KEYCLOAK_ISSUER_URL=${KEYCLOAK_ISSUER_URL:-}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-}
      - KEYCLOAK_SKIP_ISSUER_CHECK=${KEYCLOAK_SKIP_ISSUER_CHECK:-true}
      - KEYCLOAK_SKIP_CLIENT_ID_CHECK=${KEYCLOAK_SKIP_CLIENT_ID_CHECK:-true}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - TELEGRAM_POLL_TIMEOUT_SEC=${TELEGRAM_POLL_TIMEOUT_SEC:-30}
      - LOGIN_VERIFICATION_TTL_SECONDS=${LOGIN_VERIFICATION_TTL_SECONDS:-300}
      - MOEX_LIVE_CURRENT_DAY_ENABLED=${MOEX_LIVE_CURRENT_DAY_ENABLED:-false}
      - TBANK_INVEST_GRPC_ENDPOINT=${TBANK_INVEST_GRPC_ENDPOINT:-invest-public-api.tbank.ru:443}
      - TBANK_INVEST_SANDBOX_GRPC_ENDPOINT=${TBANK_INVEST_SANDBOX_GRPC_ENDPOINT:-sandbox-invest-public-api.tbank.ru:443}
      - TBANK_CA_CERT_FILE=${TBANK_CA_CERT_FILE:-/root/certs/tbank-root-ca.pem}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=100"

  moex-worker:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - MOEX_BASE_URL=${MOEX_BASE_URL:-https://iss.amogos.pro/iss}
      - MOEX_MUTABLE_DAYS=${MOEX_MUTABLE_DAYS:-30}
      - MOEX_IMMUTABLE_BEFORE_DATE=${MOEX_IMMUTABLE_BEFORE_DATE:-}
      - MOEX_SCHEDULE_TIMEZONE=${MOEX_SCHEDULE_TIMEZONE:-Europe/Moscow}
      - MOEX_ENABLE_MONTHLY_DEEP_RESYNC=${MOEX_ENABLE_MONTHLY_DEEP_RESYNC:-false}
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-moex-sync}
      - TEMPORAL_TASK_QUEUE=${TEMPORAL_TASK_QUEUE:-moex-sync}
      - TEMPORAL_ENABLE_SEARCH_ATTRIBUTES=${TEMPORAL_ENABLE_SEARCH_ATTRIBUTES:-false}
    depends_on:
      postgres:
        condition: service_healthy
      temporal-setup:
        condition: service_completed_successfully

  temporal-setup:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    command: ["./temporal-setup"]
    restart: on-failure
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-moex-sync}
      - TEMPORAL_TASK_QUEUE=${TEMPORAL_TASK_QUEUE:-moex-sync}
      - TEMPORAL_ENABLE_SEARCH_ATTRIBUTES=${TEMPORAL_ENABLE_SEARCH_ATTRIBUTES:-false}
      - MOEX_SCHEDULE_TIMEZONE=${MOEX_SCHEDULE_TIMEZONE:-Europe/Moscow}
      - MOEX_ENABLE_MONTHLY_DEEP_RESYNC=${MOEX_ENABLE_MONTHLY_DEEP_RESYNC:-false}
    depends_on:
      temporal:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_KEYCLOAK_BASE_URL: ${NEXT_PUBLIC_KEYCLOAK_BASE_URL:-/auth}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-index-replication}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-web}
        NEXT_PUBLIC_KEYCLOAK_SILENT_REDIRECT_URI: ${NEXT_PUBLIC_KEYCLOAK_SILENT_REDIRECT_URI:-}
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.priority=1"

  adminer:
    image: adminer:5.4.2
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer-local.rule=Host(`localhost`) && PathPrefix(`/adminer`)"
      - "traefik.http.routers.adminer-local.entrypoints=web"
      - "traefik.http.routers.adminer-local.priority=131"
      - "traefik.http.routers.adminer-local.middlewares=adminer-strip@docker"
      - "traefik.http.routers.adminer.rule=PathPrefix(`/adminer`)"
      - "traefik.http.routers.adminer.entrypoints=web"
      - "traefik.http.routers.adminer.priority=120"
      - "traefik.http.routers.adminer.middlewares=admin-auth-errors@docker,admin-auth@docker,adminer-strip@docker"
      - "traefik.http.middlewares.adminer-strip.stripprefix.prefixes=/adminer"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"

volumes:
  pgdata:
  keycloak_terraform_state:
