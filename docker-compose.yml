include:
  - docker-compose.temporal.yml

services:
  traefik:
    image: traefik:v2.11
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:${TRAEFIK_PORT}"
    ports:
      - "${TRAEFIK_PORT}:${TRAEFIK_PORT}"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      - PORT=30000
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_TTL=15m
      - REFRESH_TOKEN_TTL=168h
      - COOKIE_SECURE=false
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - CORS_ORIGINS=http://${WEB_HOST}
      - RUN_MIGRATIONS=true
      - MOEX_LIVE_CURRENT_DAY_ENABLED=${MOEX_LIVE_CURRENT_DAY_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=100"

  moex-worker:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - MOEX_BASE_URL=${MOEX_BASE_URL:-https://iss.amogos.pro/iss}
      - MOEX_MUTABLE_DAYS=${MOEX_MUTABLE_DAYS:-30}
      - MOEX_IMMUTABLE_BEFORE_DATE=${MOEX_IMMUTABLE_BEFORE_DATE:-}
      - MOEX_SCHEDULE_TIMEZONE=${MOEX_SCHEDULE_TIMEZONE:-Europe/Moscow}
      - MOEX_ENABLE_MONTHLY_DEEP_RESYNC=${MOEX_ENABLE_MONTHLY_DEEP_RESYNC:-false}
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-moex-sync}
      - TEMPORAL_TASK_QUEUE=${TEMPORAL_TASK_QUEUE:-moex-sync}
      - TEMPORAL_ENABLE_SEARCH_ATTRIBUTES=${TEMPORAL_ENABLE_SEARCH_ATTRIBUTES:-false}
    depends_on:
      postgres:
        condition: service_healthy
      temporal-apply-schedules:
        condition: service_completed_successfully

  temporal-apply-schedules:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    command: ["./moex-scheduler"]
    restart: on-failure
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-moex-sync}
      - TEMPORAL_TASK_QUEUE=${TEMPORAL_TASK_QUEUE:-moex-sync}
      - TEMPORAL_ENABLE_SEARCH_ATTRIBUTES=${TEMPORAL_ENABLE_SEARCH_ATTRIBUTES:-false}
      - MOEX_SCHEDULE_TIMEZONE=${MOEX_SCHEDULE_TIMEZONE:-Europe/Moscow}
      - MOEX_ENABLE_MONTHLY_DEEP_RESYNC=${MOEX_ENABLE_MONTHLY_DEEP_RESYNC:-false}
    depends_on:
      temporal-register-search-attributes:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://${WEB_HOST}
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://${WEB_HOST}
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.priority=1"

  adminer:
    image: adminer:4
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=PathPrefix(`/adminer`)"
      - "traefik.http.routers.adminer.entrypoints=web"
      - "traefik.http.routers.adminer.priority=90"
      - "traefik.http.routers.adminer.middlewares=adminer-strip"
      - "traefik.http.middlewares.adminer-strip.stripprefix.prefixes=/adminer"

volumes:
  pgdata:
