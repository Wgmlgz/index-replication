<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var THEME_PARAM = "theme";
        var APP_THEME_STORAGE_KEY = "theme";
        var KC_THEME_SESSION_KEY = "kc-theme";
        var KC_THEME_COOKIE_KEY = "kc_theme";
        var ONE_DAY_SECONDS = 24 * 60 * 60;

        function normalizeTheme(value) {
          return value === "light" || value === "dark" || value === "system"
            ? value
            : null;
        }

        function readCookie(name) {
          var prefix = name + "=";
          var parts = document.cookie ? document.cookie.split(";") : [];
          for (var i = 0; i < parts.length; i += 1) {
            var part = parts[i].trim();
            if (part.indexOf(prefix) === 0) {
              return decodeURIComponent(part.substring(prefix.length));
            }
          }
          return null;
        }

        function persistTheme(theme) {
          try {
            sessionStorage.setItem(KC_THEME_SESSION_KEY, theme);
          } catch (_err) {}
          document.cookie =
            KC_THEME_COOKIE_KEY +
            "=" +
            encodeURIComponent(theme) +
            "; path=/; max-age=" +
            String(ONE_DAY_SECONDS) +
            "; samesite=lax";
        }

        function resolveThemePreference() {
          var fromQuery = normalizeTheme(
            new URLSearchParams(window.location.search).get(THEME_PARAM)
          );
          if (fromQuery) {
            persistTheme(fromQuery);
            return fromQuery;
          }

          try {
            var fromSession = normalizeTheme(sessionStorage.getItem(KC_THEME_SESSION_KEY));
            if (fromSession) {
              return fromSession;
            }
          } catch (_err) {}

          var fromCookie = normalizeTheme(readCookie(KC_THEME_COOKIE_KEY));
          if (fromCookie) {
            return fromCookie;
          }

          try {
            var fromAppStorage = normalizeTheme(localStorage.getItem(APP_THEME_STORAGE_KEY));
            if (fromAppStorage) {
              return fromAppStorage;
            }
          } catch (_err) {}

          return "system";
        }

        function shouldUseDark(theme) {
          if (theme === "dark") {
            return true;
          }
          if (theme === "light") {
            return false;
          }
          return (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          );
        }

        try {
          var theme = resolveThemePreference();
          var useDark = shouldUseDark(theme);

          document.documentElement.classList.toggle("dark", !!useDark);
          document.documentElement.style.colorScheme = useDark ? "dark" : "light";
        } catch (_err) {
          // Ignore storage access failures and keep default light rendering.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
