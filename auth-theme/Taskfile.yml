version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install dependencies
    cmds:
      - npm ci

  dev:
    desc: Run theme in dev mode
    cmds:
      - npm run dev

  build:
    desc: Build theme frontend bundle
    cmds:
      - npm run build

  build:keycloak:
    desc: Build Keycloak theme jar (requires Java and Maven)
    cmds:
      - npm run build-keycloak-theme

  keycloakify:update:
    desc: Regenerate src/kc.gen.tsx from Keycloakify config
    cmds:
      - npm run keycloakify:update
