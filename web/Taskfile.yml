version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install dependencies
    cmds:
      - npm ci

  dev:
    desc: Run the app in dev mode
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:18080
    cmds:
      - npm run dev

  build:
    desc: Build the  app
    cmds:
      - npm run build

  start:
    desc: Serve the production build
    cmds:
      - npm run start

  lint:
    desc: Lint the app
    cmds:
      - npm run lint

  i18n:unused:
    desc: Report unused/missing i18n keys (no file writes)
    cmds:
      - npm run i18n:unused

  i18n:prune:
    desc: Remove unused i18n keys from locale files
    cmds:
      - npm run i18n:prune

  i18n:check:
    desc: Fail if unused or missing i18n keys are detected
    cmds:
      - npm run i18n:check

  storybook:
    desc: Run Storybook in dev mode
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:18080
    cmds:
      - npm run storybook

  storybook:build:
    desc: Build Storybook static files
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:18080
    cmds:
      - npm run storybook:build

  storybook:fixtures:record:
    desc: Record Storybook GET fixtures from backend
    cmds:
      - npm run storybook:fixtures:record

  api:gen:
    desc: Regenerate the API client from OpenAPI
    cmds:
      - npm run api:gen
