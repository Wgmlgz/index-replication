version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install dependencies
    cmds:
      - bun install

  dev:
    desc: Run the app in dev mode
    cmds:
      - bun run dev

  build:
    desc: Build the  app
    cmds:
      - bun run build

  start:
    desc: Serve the production build
    cmds:
      - bun run start

  lint:
    desc: Lint the app
    cmds:
      - bun run lint

  api-generate:
    desc: Regenerate the API client from OpenAPI
    cmds:
      - bun run api-generate
