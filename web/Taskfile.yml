version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install dependencies
    cmds:
      - npm ci

  dev:
    desc: Run the app in dev mode
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:18080
    cmds:
      - npm run dev

  build:
    desc: Build the  app
    cmds:
      - npm run build

  start:
    desc: Serve the production build
    cmds:
      - npm run start

  lint:
    desc: Lint the app
    cmds:
      - npm run lint

  api:gen:
    desc: Regenerate the API client from OpenAPI
    cmds:
      - npm run api:gen
