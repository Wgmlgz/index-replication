version: '3'
output: prefixed
vars:
  COMPOSE_NON_APP_SERVICES_RAW:
    sh: docker compose config --services
  COMPOSE_INFRA_SERVICES: '{{ join " " (without (splitList "\n" .COMPOSE_NON_APP_SERVICES_RAW) "web" "server" "api" "moex-worker") }}'
  COMPOSE_WAIT_SERVICES: '{{ join " " (without (splitList "\n" .COMPOSE_NON_APP_SERVICES_RAW) "web" "server" "api" "moex-worker" "temporal-admin-tools" "temporal-setup" "keycloak-terraform-db" "keycloak-terraform") }}'
  COMPOSE_WAIT_TIMEOUT: '{{.COMPOSE_WAIT_TIMEOUT | default "180"}}'
tasks:
  default:
    cmds:
      - task --list
    silent: true

  up:
    desc: Reboots docker  
    cmds:
      - docker compose up --build --force-recreate

  down:
    desc: Stops docker
    cmds:
      - docker compose down

  upx:
    desc: Compose up infra services (without web/api/moex-worker)
    cmds:
      - docker compose up -d {{.COMPOSE_INFRA_SERVICES}}
      - docker compose up --wait --wait-timeout {{.COMPOSE_WAIT_TIMEOUT}} -d {{.COMPOSE_WAIT_SERVICES}}

  devx:
    desc: Run upx, then start API, worker and web in dev mode
    cmds:
      - task upx
      - task dev

  upxb:
    desc: Rebuild and recreate infra services (without web/api/moex-worker)
    cmds:
      - docker compose up --build --force-recreate -d {{.COMPOSE_INFRA_SERVICES}}
      - docker compose up --wait --wait-timeout {{.COMPOSE_WAIT_TIMEOUT}} -d {{.COMPOSE_WAIT_SERVICES}}

  devxb:
    desc: Run upxb, then start API, worker and web in dev mode
    cmds:
      - task upxb
      - task dev

  temporal:up:
    desc: Start Temporal stack and auto-apply MOEX schedules
    cmds:
      - docker compose up postgres temporal-admin-tools temporal temporal-setup temporal-ui

  keycloak:up:
    desc: Start Keycloak with Terraform bootstrap
    cmds:
      - docker compose up postgres keycloak-terraform-db keycloak keycloak-terraform

  keycloak:apply:
    desc: Re-apply Keycloak Terraform configuration
    cmds:
      - docker compose up --force-recreate keycloak-terraform-db keycloak keycloak-terraform

  temporal:cli:
    desc: Open Temporal admin-tools shell
    cmds:
      - docker compose run --rm --entrypoint /bin/sh temporal-admin-tools

  backfill:
    desc: Start manual MOEX backfill workflow in Temporal
    vars:
      MODE: '{{.MODE | default "full"}}'
      FROM: '{{.FROM | default "1997-01-01"}}'
      TILL: '{{.TILL | default ""}}'
      CHUNK_MONTHS: '{{.CHUNK_MONTHS | default "6"}}'
      PARALLELISM: '{{.PARALLELISM | default "16"}}'
    cmds:
      - docker compose run --rm --entrypoint ./moex-backfill moex-worker --mode {{.MODE}} --from {{.FROM}} --chunk-months {{.CHUNK_MONTHS}} --parallelism {{.PARALLELISM}}{{if .TILL}} --till {{.TILL}}{{end}}

  worker:rebuild:
    desc: Rebuild MOEX worker image
    cmds:
      - docker compose build --no-cache moex-worker

  dev:
    desc: Run API, worker and web in dev mode
    deps:
      - dev:api
      - dev:worker
      - dev:web

  lint:
    desc: Lint API and web
    deps:
      - lint:api
      - lint:web

  api:gen:
    desc: Generate OpenAPI docs and regenerate the web client
    cmds:
      - task -d api api:gen
      - task -d web api:gen

  deps:
    desc: Install API, web and auth-theme dependencies
    cmds:
      - task -d api deps
      - task -d web install
      - task -d auth-theme install

  auth-theme:build:
    desc: Build auth theme frontend bundle
    cmds:
      - task -d auth-theme build

  auth-theme:build:keycloak:
    desc: Build Keycloak theme jar (host Java + Maven required)
    cmds:
      - task -d auth-theme build:keycloak

  moex:docs:
    desc: Cache MOEX ISS docs locally
    cmds:
      - node scripts/fetch-moex-docs.js

  moex:data:dump:
    desc: Dump MOEX backfill tables from local compose postgres
    cmds:
      - ./scripts/moex-backfill-transfer.sh dump

  moex:data:restore:
    desc: Restore MOEX backfill tables into local compose postgres (FILE=...)
    requires:
      vars: [FILE]
    cmds:
      - ./scripts/moex-backfill-transfer.sh restore --file {{.FILE}}

  moex:data:migrate:
    desc: Move MOEX backfill data from current docker context to TARGET_CONTEXT
    requires:
      vars: [TARGET_CONTEXT]
    cmds:
      - ./scripts/moex-backfill-transfer.sh migrate --target-context {{.TARGET_CONTEXT}}{{if .SOURCE_CONTEXT}} --source-context {{.SOURCE_CONTEXT}}{{end}}{{if .SOURCE_PROJECT}} --source-project {{.SOURCE_PROJECT}}{{end}}{{if .TARGET_PROJECT}} --target-project {{.TARGET_PROJECT}}{{end}}{{if .FILE}} --file {{.FILE}}{{end}}{{if .NO_TRUNCATE}} --no-truncate{{end}}{{if .KEEP_FILE}} --keep-file{{end}}

  tailscale:enable:
    desc: Expose localhost Adminer/Temporal UI over private Tailscale Serve
    cmds:
      - ./scripts/tailscale-admin-access.sh enable

  tailscale:disable:
    desc: Disable private Tailscale Serve mappings for Adminer/Temporal UI
    cmds:
      - ./scripts/tailscale-admin-access.sh disable

  tailscale:status:
    desc: Show current Tailscale Serve mappings
    cmds:
      - tailscale serve status

  dev:api:
    cmds:
      - task -d api dev

  dev:worker:
    cmds:
      - task -d api worker:dev

  dev:web:
    cmds:
      - task -d web dev

  lint:api:
    cmds:
      - task -d api lint

  lint:web:
    cmds:
      - task -d web lint

  i18n:unused:
    desc: Report unused/missing web i18n keys (no writes)
    cmds:
      - task -d web i18n:unused

  i18n:prune:
    desc: Remove unused web i18n keys from locale files
    cmds:
      - task -d web i18n:prune

  i18n:check:
    desc: Fail if unused or missing web i18n keys are detected
    cmds:
      - task -d web i18n:check
