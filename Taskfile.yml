version: '3'
output: prefixed
tasks:
  default:
    cmds:
      - task --list
    silent: true

  docker:
    desc: Reboots docker  
    cmds:
      - docker compose up --build --force-recreate

  upx:
    desc: Compose up services except web and server/api
    cmds:
      - SERVICES="$(docker compose config --services | grep -vE '^(web|server|api)$' | xargs)" && docker compose up -d $SERVICES

  devx:
    desc: Run upx, then start API and web in dev mode
    cmds:
      - task upx
      - task dev

  upxb:
    desc: Rebuild and recreate all compose services except web and server/api
    cmds:
      - SERVICES="$(docker compose config --services | grep -vE '^(web|server|api)$' | xargs)" && docker compose up --build --force-recreate $SERVICES

  devxb:
    desc: Run upxb, then start API and web in dev mode
    cmds:
      - task upxb
      - task dev

  temporal:up:
    desc: Start Temporal stack and auto-apply MOEX schedules
    cmds:
      - docker compose up postgres temporal-admin-tools temporal temporal-setup temporal-ui

  temporal:cli:
    desc: Open Temporal admin-tools shell
    cmds:
      - docker compose run --rm --entrypoint /bin/sh temporal-admin-tools

  backfill:
    desc: Start manual MOEX backfill workflow in Temporal
    vars:
      MODE: '{{.MODE | default "full"}}'
      FROM: '{{.FROM | default "1997-01-01"}}'
      TILL: '{{.TILL | default ""}}'
      CHUNK_MONTHS: '{{.CHUNK_MONTHS | default "6"}}'
      PARALLELISM: '{{.PARALLELISM | default "16"}}'
    cmds:
      - docker compose run --rm --entrypoint ./moex-backfill moex-worker --mode {{.MODE}} --from {{.FROM}} --chunk-months {{.CHUNK_MONTHS}} --parallelism {{.PARALLELISM}}{{if .TILL}} --till {{.TILL}}{{end}}

  worker:rebuild:
    desc: Rebuild MOEX worker image
    cmds:
      - docker compose build --no-cache moex-worker

  dev:
    desc: Run API and web in dev mode
    deps:
      - dev:api
      - dev:web

  lint:
    desc: Lint API and web
    deps:
      - lint:api
      - lint:web

  api:gen:
    desc: Generate OpenAPI docs and regenerate the web client
    cmds:
      - task -d api api:gen
      - task -d web api:gen

  deps:
    desc: Install API and web dependencies
    cmds:
      - task -d api deps
      - task -d web install

  moex:docs:
    desc: Cache MOEX ISS docs locally
    cmds:
      - node scripts/fetch-moex-docs.js

  moex:data:dump:
    desc: Dump MOEX backfill tables from local compose postgres
    cmds:
      - ./scripts/moex-backfill-transfer.sh dump

  moex:data:restore:
    desc: Restore MOEX backfill tables into local compose postgres (FILE=...)
    requires:
      vars: [FILE]
    cmds:
      - ./scripts/moex-backfill-transfer.sh restore --file {{.FILE}}

  moex:data:migrate:
    desc: Move MOEX backfill data from current docker context to TARGET_CONTEXT
    requires:
      vars: [TARGET_CONTEXT]
    cmds:
      - ./scripts/moex-backfill-transfer.sh migrate --target-context {{.TARGET_CONTEXT}}{{if .SOURCE_CONTEXT}} --source-context {{.SOURCE_CONTEXT}}{{end}}{{if .SOURCE_PROJECT}} --source-project {{.SOURCE_PROJECT}}{{end}}{{if .TARGET_PROJECT}} --target-project {{.TARGET_PROJECT}}{{end}}{{if .FILE}} --file {{.FILE}}{{end}}{{if .NO_TRUNCATE}} --no-truncate{{end}}{{if .KEEP_FILE}} --keep-file{{end}}

  dev:api:
    cmds:
      - task -d api dev

  dev:web:
    cmds:
      - task -d web dev

  lint:api:
    cmds:
      - task -d api lint

  lint:web:
    cmds:
      - task -d web lint
