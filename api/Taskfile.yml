version: '3'

dotenv:
  - .env

vars:
  GOOSE_VERSION: v3.26.0
  MIGRATIONS_DIR: ./migrations
  DATABASE_URL: '{{.DATABASE_URL | default "postgres://app:app@localhost:5432/app?sslmode=disable"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  deps:
    desc: Download Go module dependencies
    cmds:
      - go mod download

  tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go mod tidy

  fmt:
    desc: Format Go code
    cmds:
      - find . -name '*.go' -type f -print0 | xargs -0 gofmt -w

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run all tests
    cmds:
      - go run github.com/kyoh86/richgo@latest test --timeout 30s ./tests  -count=1 -v -timeout 30s

  test:repo:
    desc: Run repository tests
    cmds:
      - go test ./internal/repository -run Test

  lint:
    desc: Lint the API
    cmds:
      - go vet ./...

  dev:
    desc: Run the API locally
    env:
      GIN_LOG_FORMAT: short
    cmds:
      - go run github.com/air-verse/air@latest

  worker:dev:
    desc: Run MOEX Temporal worker locally
    cmds:
      - go run ./cmd/moex-worker

  schedules:apply:
    desc: Create/update Temporal schedules for MOEX sync workflows
    cmds:
      - go run ./cmd/moex-scheduler

  migrate:status:
    desc: Show migration status (Postgres)
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}} -dir {{.MIGRATIONS_DIR}} postgres "{{.DATABASE_URL}}" status

  migrate:up:
    desc: Apply migrations (Postgres)
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}} -dir {{.MIGRATIONS_DIR}} postgres "{{.DATABASE_URL}}" up

  migrate:down:
    desc: Roll back one migration (Postgres)
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}} -dir {{.MIGRATIONS_DIR}} postgres "{{.DATABASE_URL}}" down 1

  api:gen:
    desc: Generate OpenAPI docs (swag)
    cmds:
      - go run github.com/swaggo/swag/cmd/swag@v1.16.4 init -g ./main.go -o ./docs
