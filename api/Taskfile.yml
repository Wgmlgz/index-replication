version: '3'

dotenv:
  - .env

vars:
  GOOSE_VERSION: v3.26.0
  MIGRATIONS_DIR: ./migrations
  DEV_PUBLIC_BASE_URL: '{{.DEV_PUBLIC_BASE_URL | default "http://localhost:3000"}}'
  POSTGRES_USER: '{{.POSTGRES_USER | default "app"}}'
  POSTGRES_PASSWORD: '{{.POSTGRES_PASSWORD | default "app"}}'
  POSTGRES_HOST: '{{.POSTGRES_HOST | default "localhost"}}'
  POSTGRES_PORT: '{{.POSTGRES_PORT | default "5432"}}'
  POSTGRES_DB: '{{.POSTGRES_DB | default "app"}}'
  POSTGRES_DSN: 'postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@{{.POSTGRES_HOST}}:{{.POSTGRES_PORT}}/{{.POSTGRES_DB}}?sslmode=disable'
  WORKER_BIN: '{{if eq OS "windows"}}./tmp/moex-worker.exe{{else}}./tmp/moex-worker{{end}}'
  TELEGRAM_BOT_BIN: '{{if eq OS "windows"}}./tmp/telegram-bot.exe{{else}}./tmp/telegram-bot{{end}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  deps:
    desc: Download Go module dependencies
    cmds:
      - go mod download

  tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go mod tidy

  fmt:
    desc: Format Go code
    cmds:
      - find . -name '*.go' -type f -print0 | xargs -0 gofmt -w

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run all tests
    cmds:
      - go run github.com/kyoh86/richgo@latest test --timeout 30s ./tests  -count=1 -v -timeout 30s

  test:repo:
    desc: Run repository tests
    cmds:
      - go test ./internal/repository -run Test

  lint:
    desc: Lint the API
    cmds:
      - go vet ./...

  dev:
    desc: Run the API locally
    env:
      GIN_LOG_FORMAT: short
      SERVER_PORT: 18080
      PUBLIC_BASE_URL: '{{.DEV_PUBLIC_BASE_URL}}'
    cmds:
      - go run github.com/air-verse/air@latest

  worker:dev:
    desc: Run MOEX Temporal worker locally with hot reload
    env:
      PUBLIC_BASE_URL: '{{.DEV_PUBLIC_BASE_URL}}'
    cmds:
      - go run github.com/air-verse/air@latest --build.cmd "go build -o {{.WORKER_BIN}} ./cmd/moex-worker" --build.entrypoint "{{.WORKER_BIN}}"

  telegram:dev:
    desc: Run Telegram polling bot locally with hot reload
    env:
      PUBLIC_BASE_URL: '{{.DEV_PUBLIC_BASE_URL}}'
    cmds:
      - go run github.com/air-verse/air@latest --build.cmd "go build -o {{.TELEGRAM_BOT_BIN}} ./cmd/telegram-bot" --build.entrypoint "{{.TELEGRAM_BOT_BIN}}"

  schedules:apply:
    desc: Create/update Temporal schedules for MOEX sync workflows
    cmds:
      - go run ./cmd/moex-scheduler

  migrate:status:
    desc: Show migration status (Postgres)
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}} -dir {{.MIGRATIONS_DIR}} postgres "{{.POSTGRES_DSN}}" status

  migrate:up:
    desc: Apply migrations (Postgres)
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}} -dir {{.MIGRATIONS_DIR}} postgres "{{.POSTGRES_DSN}}" up

  migrate:down:
    desc: Roll back one migration (Postgres)
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}} -dir {{.MIGRATIONS_DIR}} postgres "{{.POSTGRES_DSN}}" down 1

  api:gen:
    desc: Generate OpenAPI docs (swag)
    cmds:
      - go run github.com/swaggo/swag/cmd/swag@v1.16.4 init -g ./main.go -o ./docs
