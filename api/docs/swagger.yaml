basePath: /api
definitions:
  models.AuditLogListResponse:
    properties:
      logs:
        items:
          $ref: '#/definitions/models.AuditLogResponse'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    required:
    - logs
    - page
    - page_size
    - total
    type: object
  models.AuditLogResponse:
    properties:
      action:
        type: string
      details:
        type: string
      entity_id:
        type: integer
      entity_type:
        type: string
      id:
        type: integer
      log_image:
        type: string
      performed_by:
        $ref: '#/definitions/models.UserShort'
      timestamp:
        type: string
    required:
    - action
    - entity_type
    - id
    - timestamp
    type: object
  models.CreateUserRequest:
    properties:
      comment:
        type: string
      full_name:
        type: string
      password:
        type: string
      role_id:
        type: integer
      username:
        type: string
    required:
    - full_name
    - password
    - role_id
    - username
    type: object
  models.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  models.LoginRequest:
    properties:
      password:
        type: string
      remember_me:
        description: Add remember me flag
        type: boolean
      username:
        type: string
    type: object
  models.MoexIndex:
    properties:
      annualHigh:
        type: number
      annualLow:
        type: number
      boardId:
        type: string
      calcMode:
        type: string
      currency:
        type: string
      decimals:
        type: integer
      hasComposition:
        type: boolean
      lastActiveDate:
        type: string
      name:
        type: string
      secid:
        type: string
      shortName:
        type: string
    type: object
  models.MoexIndexCollection:
    properties:
      id:
        type: integer
      name:
        type: string
      securityGroupId:
        type: integer
      title:
        type: string
    type: object
  models.MoexIndexCompositionEntry:
    properties:
      indexId:
        type: string
      secId:
        type: string
      shortName:
        type: string
      ticker:
        type: string
      tradeDate:
        type: string
      tradeSessionDate:
        type: string
      weight:
        type: number
    type: object
  models.MoexIndexHistoryPoint:
    properties:
      close:
        type: number
      high:
        type: number
      low:
        type: number
      open:
        type: number
      tradeDate:
        type: string
    type: object
  models.MoexIndexTickerAnalyticsPoint:
    properties:
      tradeDate:
        type: string
      weight:
        type: number
    type: object
  models.MoexIndexesOverviewResponse:
    properties:
      collections:
        items:
          $ref: '#/definitions/models.MoexIndexCollection'
        type: array
      indexes:
        items:
          $ref: '#/definitions/models.MoexIndex'
        type: array
      memberships:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
    type: object
  models.PasswordChangeRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    type: object
  models.Permission:
    properties:
      act:
        type: string
      obj:
        type: string
    required:
    - act
    - obj
    type: object
  models.PermissionsResponse:
    properties:
      permissions:
        items:
          $ref: '#/definitions/models.Permission'
        type: array
      user:
        $ref: '#/definitions/models.UserResponse'
    required:
    - permissions
    - user
    type: object
  models.UpdateUserRequest:
    properties:
      comment:
        type: string
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      phone:
        type: string
      role_id:
        type: integer
    type: object
  models.UserListResponse:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/models.UserResponse'
        type: array
    type: object
  models.UserResponse:
    properties:
      blocked_at:
        type: string
      comment:
        type: string
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_blocked:
        type: boolean
      last_active:
        type: string
      phone:
        type: string
      role_id:
        type: integer
      role_key:
        type: string
      username:
        type: string
    required:
    - blocked_at
    - comment
    - created_at
    - email
    - full_name
    - id
    - is_blocked
    - last_active
    - phone
    - role_id
    - role_key
    - username
    type: object
  models.UserSettingsPatchRequest:
    properties:
      favorites:
        items:
          type: string
        type: array
      values:
        additionalProperties:
          type: string
        type: object
    type: object
  models.UserSettingsResponse:
    properties:
      favorites:
        items:
          type: string
        type: array
      values:
        additionalProperties:
          type: string
        type: object
    type: object
  models.UserShort:
    properties:
      full_name:
        type: string
      id:
        type: integer
      username:
        type: string
    required:
    - full_name
    - id
    - username
    type: object
  repository.MoexCoverageRow:
    properties:
      dataset:
        type: string
      entityKey:
        type: string
      fromDate:
        type: string
      isComplete:
        type: boolean
      toDate:
        type: string
      updatedAt:
        type: string
    type: object
  repository.MoexSyncRunRow:
    properties:
      dataset:
        type: string
      details:
        type: string
      entityKey:
        type: string
      errorText:
        type: string
      fetchedRows:
        type: integer
      finishedAt:
        type: string
      runId:
        type: string
      startedAt:
        type: string
      status:
        type: string
      upsertedRows:
        type: integer
      workflowId:
        type: string
      workflowRunId:
        type: string
    type: object
  repository.MoexSyncStateRow:
    properties:
      checkedThroughDate:
        type: string
      dataset:
        type: string
      entityKey:
        type: string
      immutableBeforeDate:
        type: string
      lastAttemptAt:
        type: string
      lastError:
        type: string
      lastSuccessAt:
        type: string
      mutableSinceDate:
        type: string
      retryCount:
        type: integer
      status:
        type: string
      updatedAt:
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for managing retail stuff, users, organizations, and audit logs.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Retail API
  version: "1.0"
paths:
  /audit-logs:
    get:
      description: Returns a paginated list of audit logs with filters
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      - description: Search term
        in: query
        name: search
        type: string
      - description: Action filter
        in: query
        name: action
        type: string
      - description: Entity type filter
        in: query
        name: entity_type
        type: string
      - description: Entity id filter
        in: query
        name: entity_id
        type: string
      - description: Performed by user ID filter
        in: query
        name: performed_by
        type: integer
      - description: Start date (RFC3339)
        in: query
        name: start_date
        type: string
      - description: End date (RFC3339)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuditLogListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: List audit logs
      tags:
      - audit-logs
  /audit-logs/{id}:
    get:
      description: Returns details of an audit log entry
      parameters:
      - description: Audit Log ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuditLogResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get audit log
      tags:
      - audit-logs
  /audit-logs/actions:
    get:
      description: Returns available actions and entity types for filtering audit
        logs
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get audit log actions and entity types
      tags:
      - audit-logs
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and starts a session
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Login
      tags:
      - auth
  /logout:
    post:
      description: Logs out the current user and clears the session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout
      tags:
      - auth
  /me:
    get:
      consumes:
      - application/json
      description: Returns profile on logged in user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PermissionsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get self info
      tags:
      - users
  /me/password:
    put:
      consumes:
      - application/json
      description: Changes the password for the current user
      parameters:
      - description: Password change info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.PasswordChangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Change Password
      tags:
      - auth
  /me/settings:
    get:
      description: Returns settings for the current user, including favorites
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserSettingsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get current user settings
      tags:
      - settings
    patch:
      consumes:
      - application/json
      description: Updates settings for the current user, including favorites
      parameters:
      - description: Settings payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.UserSettingsPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserSettingsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Update current user settings
      tags:
      - settings
  /moex/indexes/{secid}/composition:
    get:
      description: Returns index composition snapshot
      parameters:
      - description: Index SECID
        in: path
        name: secid
        required: true
        type: string
      - description: Snapshot date (YYYY-MM-DD)
        in: query
        name: date
        type: string
      - description: Response language (ru/en)
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.MoexIndexCompositionEntry'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get MOEX index composition
      tags:
      - moex
  /moex/indexes/{secid}/composition/series:
    get:
      description: Returns downsampled weight series for index tickers
      parameters:
      - description: Index SECID
        in: path
        name: secid
        required: true
        type: string
      - description: Comma-separated list of tickers
        in: query
        name: tickers
        required: true
        type: string
      - description: Start date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: till
        type: string
      - description: Downsample interval in days
        in: query
        name: intervalDays
        type: integer
      - description: Response language (ru/en)
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/models.MoexIndexTickerAnalyticsPoint'
              type: array
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get MOEX index composition series
      tags:
      - moex
  /moex/indexes/{secid}/history:
    get:
      description: Returns downsampled history for a MOEX index
      parameters:
      - description: Index SECID
        in: path
        name: secid
        required: true
        type: string
      - description: Start date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: till
        type: string
      - description: Downsample interval in days
        in: query
        name: intervalDays
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.MoexIndexHistoryPoint'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get MOEX index history
      tags:
      - moex
  /moex/indexes/overview:
    get:
      description: Returns indexes list, collections, and membership map
      parameters:
      - description: Response language (ru/en)
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MoexIndexesOverviewResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get MOEX indexes overview
      tags:
      - moex
  /moex/sync/coverage:
    get:
      description: Returns rows from moex_data_coverage with optional filters
      parameters:
      - description: Dataset filter
        in: query
        name: dataset
        type: string
      - description: Entity key filter
        in: query
        name: entityKey
        type: string
      - description: From date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Till date (YYYY-MM-DD)
        in: query
        name: till
        type: string
      - description: Result limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repository.MoexCoverageRow'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get MOEX coverage rows
      tags:
      - moex
  /moex/sync/runs:
    get:
      description: Returns rows from moex_sync_runs with optional filters
      parameters:
      - description: Dataset filter
        in: query
        name: dataset
        type: string
      - description: Entity key filter
        in: query
        name: entityKey
        type: string
      - description: Status filter
        in: query
        name: status
        type: string
      - description: Result limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repository.MoexSyncRunRow'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get MOEX sync run history
      tags:
      - moex
  /moex/sync/state:
    get:
      description: Returns rows from moex_sync_state with optional filters
      parameters:
      - description: Dataset filter
        in: query
        name: dataset
        type: string
      - description: Entity key filter
        in: query
        name: entityKey
        type: string
      - description: Result limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repository.MoexSyncStateRow'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get MOEX sync state rows
      tags:
      - moex
  /users:
    get:
      description: Returns a paginated list of users
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      - description: Search term
        in: query
        name: search
        type: string
      - description: Sort by field
        in: query
        name: sort_by
        type: string
      - description: Sort direction (asc/desc)
        in: query
        name: sort_dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a new user
      parameters:
      - description: User info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Create user
      tags:
      - users
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Delete a user
      tags:
      - users
    get:
      description: Returns details of a user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Updates an existing user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: User update info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Update user
      tags:
      - users
  /users/{id}/block:
    post:
      description: Blocks a user and terminates their sessions
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Block user
      tags:
      - users
  /users/{id}/unblock:
    post:
      description: Unblocks a user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Unblock user
      tags:
      - users
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
