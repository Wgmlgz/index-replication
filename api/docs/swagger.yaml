externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for managing retail stuff, users, organizations, and audit logs.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Retail API
  version: "1.0"
paths:
  /audit-logs:
    get:
      description: Returns a paginated list of audit logs with filters
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      - description: Search term
        in: query
        name: search
        type: string
      - description: Action filter
        in: query
        name: action
        type: string
      - description: Entity type filter
        in: query
        name: entity_type
        type: string
      - description: Entity id filter
        in: query
        name: entity_id
        type: string
      - description: Performed by user ID filter
        in: query
        name: performed_by
        type: integer
      - description: Start date (RFC3339 or YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: End date (RFC3339 or YYYY-MM-DD)
        in: query
