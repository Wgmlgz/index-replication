basePath: /api
definitions:
  AuditLogListResponse:
    properties:
      logs:
        items:
          $ref: '#/definitions/AuditLogResponse'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    required:
    - logs
    - page
    - page_size
    - total
    type: object
  AuditLogResponse:
    properties:
      action:
        type: string
      details:
        type: string
      entity_id:
        type: integer
      entity_type:
        type: string
      id:
        type: integer
      log_image:
        type: string
      performed_by:
        $ref: '#/definitions/UserShort'
      timestamp:
        type: string
    required:
    - action
    - entity_type
    - id
    - timestamp
    type: object
  CreateUserRequest:
    properties:
      comment:
        type: string
      full_name:
        type: string
      password:
        type: string
      role_id:
        type: integer
      username:
        type: string
    required:
    - full_name
    - password
    - role_id
    - username
    type: object
  ErrorResponse:
    properties:
      error:
        type: string
    type: object
  LoginRequest:
    properties:
      password:
        type: string
      remember_me:
        type: boolean
      username:
        type: string
    type: object
  LoginVerifyRequest:
    properties:
      challenge_id:
        type: string
    type: object
  LoginVerifyStatusResponse:
    properties:
      status:
        type: string
    type: object
  MoexIndex:
    properties:
      annualHigh:
        type: number
      annualLow:
        type: number
      boardId:
        type: string
      calcMode:
        type: string
      currency:
        type: string
      decimals:
        type: integer
      hasComposition:
        type: boolean
      lastActiveDate:
        type: string
      name:
        type: string
      secid:
        type: string
      shortName:
        type: string
    type: object
  MoexIndexCollection:
    properties:
      id:
        type: integer
      name:
        type: string
      securityGroupId:
        type: integer
      title:
        type: string
    type: object
  MoexIndexCompositionEntry:
    properties:
      indexId:
        type: string
      secId:
        type: string
      shortName:
        type: string
      ticker:
        type: string
      tradeDate:
        type: string
      tradeSessionDate:
        type: string
      weight:
        type: number
    type: object
  MoexIndexHistoryPoint:
    properties:
      close:
        type: number
      high:
        type: number
      low:
        type: number
      open:
        type: number
      tradeDate:
        type: string
    type: object
  MoexIndexTickerAnalyticsPoint:
    properties:
      tradeDate:
        type: string
      weight:
        type: number
    type: object
  MoexIndexesOverviewResponse:
    properties:
      collections:
        items:
          $ref: '#/definitions/MoexIndexCollection'
        type: array
      indexes:
        items:
          $ref: '#/definitions/MoexIndex'
        type: array
      memberships:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
    type: object
  PasswordChangeRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    type: object
  Permission:
    properties:
      act:
        type: string
      obj:
        type: string
    required:
    - act
    - obj
    type: object
  PermissionsResponse:
    properties:
      permissions:
        items:
          $ref: '#/definitions/Permission'
        type: array
      user:
        $ref: '#/definitions/UserResponse'
    required:
    - permissions
    - user
    type: object
  TBankAccount:
    properties:
      access_level:
        type: string
      closed_at:
        type: string
      id:
        type: string
      name:
        type: string
      opened_at:
        type: string
      status:
        type: string
      type:
        type: string
    type: object
  TBankAccountPortfolioResponse:
    properties:
      account_id:
        type: string
      daily_yield:
        type: number
      daily_yield_relative:
        type: number
      environment:
        type: string
      money:
        items:
          $ref: '#/definitions/TBankMoneyBalance'
        type: array
      positions:
        items:
          $ref: '#/definitions/TBankPortfolioPosition'
        type: array
      total_amount_portfolio:
        type: number
      total_amount_portfolio_currency:
        type: string
    type: object
  TBankConnectRequest:
    properties:
      default_account_id:
        type: string
      environment:
        enum:
        - sandbox
        - production
        type: string
      token:
        type: string
    required:
    - environment
    - token
    type: object
  TBankConnectionStatusResponse:
    properties:
      accounts:
        items:
          $ref: '#/definitions/TBankAccount'
        type: array
      connected:
        type: boolean
      connection_error:
        type: string
      default_account_id:
        type: string
      environment:
        type: string
      token_masked:
        type: string
    type: object
  TBankInstrumentLookupItem:
    properties:
      api_trade_available:
        type: boolean
      class_code:
        type: string
      figi:
        type: string
      for_iis:
        type: boolean
      for_qual_investor:
        type: boolean
      instrument_id:
        type: string
      instrument_type:
        type: string
      isin:
        type: string
      lot:
        type: integer
      name:
        type: string
      position_uid:
        type: string
      ticker:
        type: string
      uid:
        type: string
    type: object
  TBankInstrumentLookupResponse:
    properties:
      class_code:
        type: string
      instruments:
        items:
          $ref: '#/definitions/TBankInstrumentLookupItem'
        type: array
      query:
        type: string
    type: object
  TBankMoneyBalance:
    properties:
      available:
        type: number
      blocked:
        type: number
      currency:
        type: string
      withdraw_available:
        type: number
      withdraw_blocked:
        type: number
    type: object
  TBankPortfolioPosition:
    properties:
      currency:
        type: string
      current_price:
        type: number
      current_value:
        type: number
      expected_yield:
        type: number
      figi:
        type: string
      instrument_id:
        type: string
      instrument_type:
        type: string
      name:
        type: string
      quantity:
        type: number
      ticker:
        type: string
    type: object
  TBankSandboxPayInRequest:
    properties:
      account_id:
        type: string
      currency:
        type: string
      units:
        type: integer
    type: object
  TBankSandboxPayInResponse:
    properties:
      account_id:
        type: string
      currency:
        type: string
      environment:
        type: string
      units:
        type: integer
    type: object
  TBankSetDefaultAccountRequest:
    properties:
      account_id:
        type: string
    required:
    - account_id
    type: object
  TBankTestBuyRequest:
    properties:
      account_id:
        type: string
      instrument_id:
        type: string
      quantity:
        minimum: 1
        type: integer
    required:
    - instrument_id
    - quantity
    type: object
  TBankTestBuyResponse:
    properties:
      account_id:
        type: string
      environment:
        type: string
      execution_report_status:
        type: string
      instrument_id:
        type: string
      order_id:
        type: string
      quantity:
        type: integer
      response:
        additionalProperties: true
        type: object
    type: object
  TelegramConnectResponse:
    properties:
      connect_url:
        type: string
      expires_at:
        type: string
    type: object
  TelegramPatchRequest:
    properties:
      login_2fa_enabled:
        type: boolean
    type: object
  TelegramStatusResponse:
    properties:
      bot_username:
        type: string
      connected:
        type: boolean
      login_2fa_enabled:
        type: boolean
      telegram_username:
        type: string
    type: object
  UpdateUserRequest:
    properties:
      comment:
        type: string
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      phone:
        type: string
      role_id:
        type: integer
    type: object
  UserListResponse:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/UserResponse'
        type: array
    type: object
  UserResponse:
    properties:
      blocked_at:
        type: string
      comment:
        type: string
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_blocked:
        type: boolean
      last_active:
        type: string
      phone:
        type: string
      role_id:
        type: integer
      role_key:
        type: string
      username:
        type: string
    required:
    - blocked_at
    - comment
    - created_at
    - email
    - full_name
    - id
    - is_blocked
    - last_active
    - phone
    - role_id
    - role_key
    - username
    type: object
  UserSettingsPatchRequest:
    properties:
      favorites:
        items:
          type: string
        type: array
      values:
        additionalProperties:
          type: string
        type: object
    type: object
  UserSettingsResponse:
    properties:
      favorites:
        items:
          type: string
        type: array
      values:
        additionalProperties:
          type: string
        type: object
    type: object
  UserShort:
    properties:
      full_name:
        type: string
      id:
        type: integer
      username:
        type: string
    required:
    - full_name
    - id
    - username
    type: object
  repository.MoexCoverageRow:
    properties:
      dataset:
        type: string
      entityKey:
        type: string
      fromDate:
        type: string
      isComplete:
        type: boolean
      toDate:
        type: string
      updatedAt:
        type: string
    type: object
  repository.MoexSyncRunRow:
    properties:
      dataset:
        type: string
      details:
        type: string
      entityKey:
        type: string
      errorText:
        type: string
      fetchedRows:
        type: integer
      finishedAt:
        type: string
      runId:
        type: string
      startedAt:
        type: string
      status:
        type: string
      upsertedRows:
        type: integer
      workflowId:
        type: string
      workflowRunId:
        type: string
    type: object
  repository.MoexSyncStateRow:
    properties:
      checkedThroughDate:
        type: string
      dataset:
        type: string
      entityKey:
        type: string
      immutableBeforeDate:
        type: string
      lastAttemptAt:
        type: string
      lastError:
        type: string
      lastSuccessAt:
        type: string
      mutableSinceDate:
        type: string
      retryCount:
        type: integer
      status:
        type: string
      updatedAt:
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for managing retail stuff, users, organizations, and audit logs.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Retail API
  version: "1.0"
paths:
  /audit-logs:
    get:
      description: Returns a paginated list of audit logs with filters
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      - description: Search term
        in: query
        name: search
        type: string
      - description: Action filter
        in: query
        name: action
        type: string
      - description: Entity type filter
        in: query
        name: entity_type
        type: string
      - description: Entity id filter
        in: query
        name: entity_id
        type: string
      - description: Performed by user ID filter
        in: query
        name: performed_by
        type: integer
      - description: Start date (RFC3339)
        in: query
        name: start_date
        type: string
      - description: End date (RFC3339)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuditLogListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List audit logs
      tags:
      - audit-logs
  /audit-logs/{id}:
    get:
      description: Returns details of an audit log entry
      parameters:
      - description: Audit Log ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuditLogResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get audit log
      tags:
      - audit-logs
  /audit-logs/actions:
    get:
      description: Returns available actions and entity types for filtering audit
        logs
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get audit log actions and entity types
      tags:
      - audit-logs
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and starts a session
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Login
      tags:
      - auth
  /login/verify:
    post:
      consumes:
      - application/json
      description: Checks Telegram challenge status and completes login when approved
      parameters:
      - description: Verification challenge
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/LoginVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/LoginVerifyStatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Complete login verification
      tags:
      - auth
  /logout:
    post:
      description: Logs out the current user and clears the session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout
      tags:
      - auth
  /me:
    get:
      consumes:
      - application/json
      description: Returns profile on logged in user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PermissionsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get self info
      tags:
      - users
  /me/password:
    put:
      consumes:
      - application/json
      description: Changes the password for the current user
      parameters:
      - description: Password change info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/PasswordChangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Change Password
      tags:
      - auth
  /me/settings:
    get:
      description: Returns settings for the current user, including favorites
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserSettingsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get current user settings
      tags:
      - settings
    patch:
      consumes:
      - application/json
      description: Updates settings for the current user, including favorites
      parameters:
      - description: Settings payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/UserSettingsPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserSettingsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Update current user settings
      tags:
      - settings
  /me/tbank:
    get:
      description: Returns current user T-Bank connection state and available accounts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TBankConnectionStatusResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get T-Bank integration status
      tags:
      - tbank
  /me/tbank/connect:
    post:
      consumes:
      - application/json
      description: Saves user token/environment and verifies access by loading accounts
      parameters:
      - description: T-Bank connect payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/TBankConnectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TBankConnectionStatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Connect T-Bank account
      tags:
      - tbank
  /me/tbank/default-account:
    post:
      consumes:
      - application/json
      description: Sets connected account to use by default for test-buy and portfolio
        actions
      parameters:
      - description: Default account payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/TBankSetDefaultAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TBankConnectionStatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Set T-Bank default account
      tags:
      - tbank
  /me/tbank/disconnect:
    post:
      description: Removes saved T-Bank credentials for the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Disconnect T-Bank account
      tags:
      - tbank
  /me/tbank/instruments/lookup:
    get:
      description: Resolves T-Bank instrument candidates by MOEX ticker and optional
        class code
      parameters:
      - description: MOEX ticker
        in: query
        name: ticker
        required: true
        type: string
      - description: MOEX class code (for exact filtering)
        in: query
        name: class_code
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TBankInstrumentLookupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Find T-Bank instrument id by ticker
      tags:
      - tbank
  /me/tbank/portfolio:
    get:
      description: Returns balances and positions for selected account (or default
        account if omitted)
      parameters:
      - description: Account id
        in: query
        name: account_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TBankAccountPortfolioResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get T-Bank account balances and portfolio
      tags:
      - tbank
  /me/tbank/sandbox/pay-in:
    post:
      consumes:
      - application/json
      description: Adds virtual money to selected sandbox account
      parameters:
      - description: Sandbox pay-in payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/TBankSandboxPayInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TBankSandboxPayInResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Top up T-Bank sandbox account
      tags:
      - tbank
  /me/tbank/test-buy:
    post:
      consumes:
      - application/json
      description: Places a market buy order using the connected user T-Bank account
      parameters:
      - description: T-Bank test buy payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/TBankTestBuyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TBankTestBuyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Create T-Bank test buy order
      tags:
      - tbank
  /me/verification/telegram:
    delete:
      description: Removes Telegram connection and disables Telegram login verification
        for the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TelegramStatusResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Unlink Telegram verification
      tags:
      - verification
    get:
      description: Returns Telegram connection status and whether login verification
        is enabled
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TelegramStatusResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get Telegram verification status
      tags:
      - verification
